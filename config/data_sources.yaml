version: 1

# Raw files are intentionally excluded from Git. The hashes below identify the
# exact byte-level inputs used by the recorded development studies.
datasets:
  pidd:
    expected_path: data/raw/pidd.csv
    expected_filename: pidd.csv
    expected_sha256: 6bfe5d0f379d17a0e0819b996407e3c09bf80febd4287f2ed212190dfff154af
    acquisition: openml_reconstruction
    source_page: https://www.openml.org/d/37
    download_url: https://www.openml.org/data/get_csv/37/dataset_37_diabetes.arff
    historical_uci_url: https://archive.ics.uci.edu/ml/machine-learning-databases/pima-indians-diabetes/pima-indians-diabetes.data
    notes:
      - The original UCI file URL returned HTTP 404 when rechecked on 2026-08-28.
      - The helper reconstructs the exact historical nine-column file from OpenML dataset 37 and verifies the final SHA-256.
      - Original owners are the US National Institute of Diabetes and Digestive and Kidney Diseases; the historical UCI record names Vincent Sigillito as donor.

  sylhet:
    expected_path: data/raw/sylhet.csv
    expected_filename: sylhet.csv

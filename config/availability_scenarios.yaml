datasets:
  pidd:
    scenarios:
      full:
        description: All eight PIDD predictors are available.
        available_features:
          - Pregnancies
          - Glucose
          - BloodPressure
          - SkinThickness
          - Insulin
          - BMI
          - DiabetesPedigreeFunction
          - Age
      no_insulin_or_skinfold:
        description: Insulin and skinfold measurements are unavailable.
        available_features:
          - Pregnancies
          - Glucose
          - BloodPressure
          - BMI
          - DiabetesPedigreeFunction
          - Age
      routine_clinic:
        description: Routine history and measurements, without insulin, skinfold, or pedigree score.
        available_features:
          - Pregnancies
          - Glucose
          - BloodPressure
          - BMI
          - Age
      core_metabolic:
        description: Four high-value metabolic and demographic predictors.
        available_features:
          - Glucose
          - BMI
          - DiabetesPedigreeFunction
          - Age
      non_laboratory:
        description: No glucose, blood-pressure, insulin, or skinfold measurement.
        available_features:
          - Pregnancies
          - BMI
          - DiabetesPedigreeFunction
          - Age
      minimal_glucose_age:
        description: Only glucose and age are available; used as a severe-degradation scenario.
        available_features:
          - Glucose
          - Age
    router_models:
      - random_forest
      - xgboost
      - lightgbm
      - catboost
    selection_metric: brier_score
    selection_tiebreak_metrics:
      - log_loss
      - negative_average_precision
    minimum_supported_features: 2

  sylhet:
    scenarios:
      full:
        description: All sixteen Sylhet demographic and symptom predictors are available.
        available_features:
          - Age
          - Gender
          - Polyuria
          - Polydipsia
          - sudden weight loss
          - weakness
          - Polyphagia
          - Genital thrush
          - visual blurring
          - Itching
          - Irritability
          - delayed healing
          - partial paresis
          - muscle stiffness
          - Alopecia
          - Obesity
      core_questionnaire:
        description: Demographics plus common early-stage diabetes symptoms.
        available_features:
          - Age
          - Gender
          - Polyuria
          - Polydipsia
          - sudden weight loss
          - weakness
          - Polyphagia
          - visual blurring
          - delayed healing
          - Obesity
      core_symptoms:
        description: Six symptom-only questionnaire fields.
        available_features:
          - Polyuria
          - Polydipsia
          - sudden weight loss
          - weakness
          - Polyphagia
          - delayed healing
      classic_symptoms:
        description: The four classic symptom indicators in this cohort.
        available_features:
          - Polyuria
          - Polydipsia
          - sudden weight loss
          - Polyphagia
      minimal_polyuria_polydipsia:
        description: Severe-degradation panel with polyuria and polydipsia only.
        available_features:
          - Polyuria
          - Polydipsia
    router_models:
      - random_forest
      - xgboost
      - lightgbm
      - catboost
    selection_metric: brier_score
    selection_tiebreak_metrics:
      - log_loss
      - negative_average_precision
    minimum_supported_features: 2

  brfss:

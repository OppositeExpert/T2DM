          - Smoker
          - Stroke
          - HeartDiseaseorAttack
          - PhysActivity
          - Fruits
          - Veggies
          - HvyAlcoholConsump
          - AnyHealthcare
          - NoDocbcCost
          - GenHlth
          - MentHlth
          - PhysHlth
          - DiffWalk
          - Sex
          - Age
          - Education
          - Income
      cardiometabolic_health:
        description: Cardiometabolic history, BMI, general health, mobility, and age.
        available_features:
          - HighBP
          - HighChol
          - BMI
          - Stroke
          - HeartDiseaseorAttack
          - GenHlth
          - PhysHlth
          - DiffWalk
          - Age
      routine_survey:
        description: Common self-reported health, lifestyle, demographic, and access fields.
        available_features:
          - HighBP
          - HighChol
          - BMI
          - Smoker
          - PhysActivity
          - GenHlth
          - PhysHlth
          - DiffWalk
          - Sex
          - Age
          - Education
          - Income
      health_status:
        description: Compact health-status and demographic panel.
        available_features:
          - HighBP
          - BMI
          - GenHlth
          - PhysHlth
          - DiffWalk
          - Age
      demographics_health:
        description: General health plus demographic and socioeconomic fields.
        available_features:
          - GenHlth
          - Sex
          - Age
          - Education
          - Income
      minimal_general_health_age:

name: smoke
seed: 42
optimization_metric: average_precision
n_trials: 2
n_bootstrap: 50
model_n_jobs: 4
inner_folds_override: 3
max_repeats: 1
max_outer_folds: 1
calibration_methods:
  - identity
  - sigmoid
calibration_minimum_samples:
  isotonic: 1000
threshold_policies:
  - fixed_0_5
  - youden_development
  - sensitivity_constrained
sensitivity_target: 0.80
sample_limits:
  brfss: 10000
  pidd: null
  sylhet: null
  hospital130: 10000

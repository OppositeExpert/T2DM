version: 1
target_readiness: conference_submission
primary_endpoint: diabetes_screening
primary_datasets:
  - pidd
  - sylhet
  - brfss

# These flags must be changed only when the corresponding signed-off artifact
# exists. The readiness auditor treats false values as manuscript blockers.
protocol_frozen: false
novelty_review_complete: false
claim_evidence_table_complete: false
tripod_ai_checklist_complete: false
probast_ai_assessment_complete: false
ablation_study_complete: false
selective_prediction_evaluation_complete: false
subgroup_analysis_complete: false

# External validation is a warning for the scoped conference paper and a hard
# requirement before journal-strength or clinical-generalization claims.
external_or_temporal_validation_complete: false

# There is no matched cohort containing PIDD, Sylhet, and BRFSS profiles for the
# same people. Keep the mixed router outside the primary efficacy claim.
mixed_router_role: software_demonstration_only
cross_dataset_selector_validated: false

# The development pilots do not establish a reliable advantage from switching
# algorithms. The manuscript's primary claim must focus on availability,
# calibration, degradation, and abstention unless the locked final evidence
# changes that conclusion.
dynamic_model_selection_role: secondary_negative_result

# Draft analysis controls. These document the current prespecification state but
# do not authorize final execution. Phase 2 literature review and the clinical
# threshold review may revise them before protocol_frozen becomes true.
analysis_plan:
  status: draft_unlocked
  version: 0.1
  recorded_date: 2026-08-23
  artifact: docs/research/Statistical_Analysis_Plan.md
  endpoint_hierarchy_artifact: docs/research/Endpoint_and_Claim_Hierarchy.md
  threshold_policy_artifact: docs/research/Threshold_and_Clinical_Utility_Policy.md
  confidence_level: 0.95
  final_bootstrap_resamples: 2000
  primary_probability_metric: brier_score
  primary_discrimination_metrics:
    - auroc
    - average_precision
  repeated_cv_primary_inference_unit: unique_participant
  sylhet_resampling_unit: identical_feature_profile
  brfss_resampling_unit: individual
  hospital130_resampling_unit: patient
  multiplicity_method: holm
  final_split_creation_authorized: false
  final_holdout_seed: null
  final_holdout_manifest: null
  final_holdout_manifest_sha256: null
  final_authorization_record: null
  final_execution_authorized: false

reporting_standards:
  tripod_ai:
    citation: BMJ 2024;385:e078378
    doi: 10.1136/bmj-2023-078378
  probast_ai:
    citation: BMJ 2025;388:e082505
    doi: 10.1136/bmj-2024-082505

schema_version: "1.0"
protocol_id: t2dm-final-internal-validation-v1
title: An Availability-Aware, Leakage-Controlled Framework for Evaluating Diabetes Risk Models Across Heterogeneous Cohorts
target_journal: Discover Applied Sciences
status: frozen
frozen_at_utc: 2026-09-10T00:00:00Z
protocol_sha256: 69bcc324474cc330ae20db5ecb771415f049b292057c9b93a14928de697d0cf6

claim_boundaries:
  primary_contribution:
    - feature_availability_degradation
    - leakage_controlled_evaluation
    - endpoint_safety
    - calibration
    - uncertainty_estimation
    - explainability
    - provenance_preserving_fallback
    - prespecified_evaluated_panels
    - unsupported_input_abstention
  dynamic_model_switching: secondary_negative_result
  hospital130: separate_30_day_readmission_endpoint
  cross_cohort_probability_pooling: prohibited
  shap_causal_interpretation: prohibited
  retrospective_net_benefit_clinical_validation: prohibited

evaluation_strategies:
  pidd: repeated_nested_internal_validation
  sylhet: repeated_nested_grouped_internal_validation
  brfss: internal_validation_only
  hospital130: full_cohort_patient_grouped_internal_validation
  brfss_final_strategy: INTERNAL_VALIDATION_ONLY
  hospital130_final_strategy: COMPLETE_FULL_INTERNAL_VALIDATION
  disclosure: All source outcomes and the historical seed-42 evaluation partitions were accessed during development; no result may be described as an untouched independent final test.

profile:
  name: final_internal_validation
  locked: true
  seed: 42
  optuna_trials_per_model_per_fold: 75
  bootstrap_resamples: 2000
  sample_limits: null

datasets:
  pidd:
    task: diabetes_screening
    endpoint: diabetes_positive_label
    evaluation_population: all_768_records
    split: 5_repeats_x_5_outer_folds_stratified
    inner_folds: 5
    group_unit: participant
    preprocessing_special_case: physiologically_implausible_zeros_are_fold_locally_imputed_missing_values
  sylhet:
    task: diabetes_screening
    endpoint: early_stage_diabetes_positive_label
    evaluation_population: all_520_records
    split: 5_repeats_x_5_outer_folds_stratified_grouped
    inner_folds: 5
    group_unit: identical_predictor_profile
  brfss:
    task: diabetes_screening
    endpoint: self_reported_diagnosed_diabetes
    evaluation_population: 429360_target_valid_respondents
    split: historical_seed_42_80_20_partition_with_5_development_folds
    inner_folds: 5
    group_unit: individual
    independent_holdout: false
  hospital130:
    task: hospital_readmission
    endpoint: readmission_within_30_days
    evaluation_population: full_eligible_cohort_after_prespecified_death_hospice_exclusions
    split: historical_seed_42_patient_grouped_80_20_partition_with_5_development_folds
    inner_folds: 5
    group_unit: patient
    independent_holdout: false

models:
  registry:
    - logistic_regression
    - random_forest
    - xgboost
    - lightgbm
    - catboost
  implementation: src/diabetes_pipeline/models/registry.py
  search_spaces: src/diabetes_pipeline/models/registry.py::suggest_parameters
  optuna_objective: mean_inner_fold_average_precision
  optimization_direction: maximize
  sampler: seeded_tpe
  pruner: median_pruner

preprocessing:
  implementation: src/diabetes_pipeline/preprocessing/builders.py
  fit_scope: training_fold_only
  numeric_imputation: median_with_missingness_indicators
  scaling: logistic_regression_numeric_features_only
  categorical_imputation: constant_missing_token
  categorical_vocabulary: training_fold_only_one_hot_ignore_unknown
  feature_selection: none

calibration:
  candidates: [identity, sigmoid, isotonic]
  selection_data: cross_fitted_training_probabilities_only
  primary_selection_metric: brier_score
  tiebreak_metric: log_loss
  isotonic_minimum_observations: 1000

thresholds:
  policies: [fixed_0_5, youden_development, sensitivity_constrained]
  sensitivity_target: 0.80
  selection_data: cross_fitted_training_probabilities_only
  clinical_validation_claim_allowed: false

availability:
  definitions: config/availability_scenarios.yaml
  semantics: dataset_native_prespecified_panels_only
  selection_order: largest_fully_supported_panel_then_development_selected_model_and_calibrator
  missing_feature_fabrication: prohibited
  unsupported_behavior: abstain
  ontology_use: documentation_and_constraints_not_cross_cohort_harmonization

metrics:
  primary: [auroc, average_precision, brier_score]
  secondary:
    - scaled_brier_score
    - log_loss
    - calibration_intercept
    - calibration_slope
    - observed_expected_ratio
    - expected_calibration_error
    - sensitivity
    - specificity
    - ppv
    - npv
    - confusion_counts
  decision_curve: net_benefit_over_prespecified_threshold_grid

uncertainty:
  confidence_level: 0.95
  method: percentile_bootstrap
  resamples: 2000
  pidd_unit: participant
  sylhet_unit: identical_predictor_profile
  brfss_unit: individual
  hospital130_unit: patient_cluster
  minimum_valid_replicate_fraction: 0.95

comparisons:
  paired: true
  metrics: [auroc, average_precision, brier_score, log_loss]
  multiplicity_correction: holm_within_prespecified_metric_family
  superiority_claim_requires_adjusted_p_below_0_05: true

explainability:
  method: shap
  observations: held_out_or_outer_validation_only
  maximum_samples_per_fold_or_model: 1000
  background_size: 100
  local_top_k: 5
  transformed_components_grouped_to_source_variable: true
  reconstruction_check_required: true
  cross_model_raw_magnitude_comparison: prohibited_when_output_scales_differ

aggregation:
  pidd_and_sylhet: participant_mean_probability_across_repeats
  brfss: historical_evaluation_partition_without_cross_cohort_pooling
  hospital130: encounter_predictions_with_patient_cluster_uncertainty
  cross_dataset_leaderboard: prohibited

